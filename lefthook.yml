pre-commit:
  parallel: false
  commands:
    trailing-whitespace:
      tags: style
      glob: "*.{yaml,yml,md,txt,ts,go}"
      run: |
        for file in {staged_files}; do
          sed -i '' -e 's/[[:space:]]*$//' "$file" 2>/dev/null || sed -i -e 's/[[:space:]]*$//' "$file"
          git add "$file"
        done

    end-of-file-fixer:
      tags: style
      glob: "*.{yaml,yml,md,txt,ts,go}"
      run: |
        for file in {staged_files}; do
          tail -c1 "$file" | read -r _ || echo "" >> "$file"
          git add "$file"
        done

    check-yaml:
      tags: linters
      glob: "*.{yaml,yml}"
      run: npx yaml-lint {staged_files}

    golangci-lint:
      tags: linters
      glob: "*.go"
      root: "be/"
      run: golangci-lint run --timeout 5m

    check-added-large-files:
      tags: security
      run: |
        for file in {staged_files}; do
          if [ $(wc -c < "$file") -gt 5120000 ]; then
            echo "$file is larger than 5MB" && exit 1
          fi
        done

commit-msg:
  commands:
    conventional-commit:
      run: npx commitlint --default-config --edit {1}
