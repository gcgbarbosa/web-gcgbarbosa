#:schema https://json.schemastore.org/any.json

env_files = []
root = "."
testdata_dir = "testdata"
tmp_dir = "be/tmp"

[build]
args_bin = ["serve", "--http=127.0.0.1:8090", "--dir", "./be/pb_data"]
bin = "./be/tmp/main"

cmd = "cd be && go build -o ./tmp/main ."

delay = 1000
entrypoint = ["./be/tmp/main"]

include_dir = ["be"]
exclude_dir = ["be/tmp", "be/pb_data", "src", "static"]
exclude_file = []
exclude_regex = ["_test.go", ".md", ".yaml", ".ts", ".svelte", ".json"]
exclude_unchanged = false
follow_symlink = false
full_bin = ""
ignore_dangerous_root_dir = false
include_ext = ["go", "tpl", "tmpl", "html"]
include_file = []
kill_delay = "0s"
log = "build-errors.log"
poll = false
poll_interval = 0
post_cmd = []
pre_cmd = []
rerun = false
rerun_delay = 500
send_interrupt = false
stop_on_error = false

[color]
app = ""
build = "yellow"
main = "magenta"
mode = ""
runner = "green"
watcher = "cyan"

[log]
main_only = false
silent = false
time = false

[misc]
clean_on_exit = false

[proxy]
app_port = 0
app_start_timeout = 0
enabled = false
proxy_port = 0

[screen]
clear_on_rebuild = false
keep_scroll = true
